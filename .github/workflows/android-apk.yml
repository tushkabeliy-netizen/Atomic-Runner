name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      # The published Godot CI image uses 4.3, not 4.3.0.
      image: barichello/godot-ci:4.3
    env:
      GODOT_VERSION: "4.3"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot export templates and Android settings
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config"
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable "$HOME/.local/share/godot/export_templates/"
          fi
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot "$HOME/.config/"
          fi
          godot --version
          test -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Import project and install Android build template
        run: |
          godot --headless --editor --path . --quit
          godot --headless --editor --path . --install-android-build-template --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/AtomicRunner-debug.apk
          test -s build/AtomicRunner-debug.apk
          file build/AtomicRunner-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AtomicRunner-debug-apk
          path: build/AtomicRunner-debug.apk
          if-no-files-found: error
          retention-days: 30
